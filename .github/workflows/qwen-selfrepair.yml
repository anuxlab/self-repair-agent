name: Open-Source SLM Self-Repair Benchmark

on:
  workflow_dispatch:
    inputs:
      run_qwen3_4b:
        description: "Opt in to the slow Qwen3 4B CPU benchmark (disabled by default)"
        required: false
        type: boolean
        default: false
      run_extended_coders:
        description: "Also test DeepCoder, OpenCoder, Yi-Coder, and DeepSeek-Coder small coding models"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "problems/**"
      - "tests/**"
      - ".github/workflows/qwen-selfrepair.yml"
      - "requirements.txt"
      - "scripts/**"

permissions:
  contents: read
  actions: read

jobs:
  select-models:
    name: Select benchmark models
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.models.outputs.matrix }}
    steps:
      - id: models
        env:
          RUN_QWEN3_4B: ${{ github.event_name == 'workflow_dispatch' && inputs.run_qwen3_4b }}
          RUN_EXTENDED_CODERS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_extended_coders }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYMATRIX' >> "$GITHUB_OUTPUT"
          import json, os, sys

          # Keep the default run compact. The extended suite is opt-in because
          # each matrix entry consumes a separate hosted-runner job and download.
          models = [
              {"model": "qwen3:0.6b", "artifact": "qwen3-0.6b", "timeout": "150"},
              {"model": "qwen3:1.7b", "artifact": "qwen3-1.7b", "timeout": "150"},
              {"model": "qwen2.5-coder:0.5b", "artifact": "qwen2-5-coder-0.5b", "timeout": "150"},
              {"model": "qwen2.5-coder:1.5b", "artifact": "qwen2-5-coder-1.5b", "timeout": "150"},
              {"model": "qwen2.5-coder:3b", "artifact": "qwen2-5-coder-3b", "timeout": "210"},
          ]
          if os.environ.get("RUN_EXTENDED_CODERS", "false").lower() == "true":
              models.extend([
                  {"model": "deepcoder:1.5b", "artifact": "deepcoder-1.5b", "timeout": "210"},
                  {"model": "opencoder:1.5b", "artifact": "opencoder-1.5b", "timeout": "180"},
                  {"model": "yi-coder:1.5b", "artifact": "yi-coder-1.5b", "timeout": "180"},
                  {"model": "deepseek-coder:1.3b", "artifact": "deepseek-coder-1.3b", "timeout": "180"},
              ])
              print("Extended coding-model suite enabled.", file=sys.stderr)
          if os.environ.get("RUN_QWEN3_4B", "false").lower() == "true":
              models.append({"model": "qwen3:4b", "artifact": "qwen3-4b", "timeout": "300"})
              print("Qwen3 4B explicitly enabled; expect substantially slower CPU inference.", file=sys.stderr)
          else:
              print("Qwen3 4B is paused. Enable it only for a manual workflow_dispatch run.", file=sys.stderr)
          print("matrix=" + json.dumps({"include": models}, separators=(",", ":")))
          PYMATRIX


  benchmark:
    name: Benchmark ${{ matrix.model }}
    needs: select-models
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-models.outputs.matrix) }}
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      QWEN_MODEL: ${{ matrix.model }}
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
      MAX_REPAIR_ROUNDS: "3"
      EXEC_TIMEOUT_SECONDS: "5"
      LLM_TIMEOUT_SECONDS: ${{ matrix.timeout }}
      LLM_MAX_TOKENS: "1024"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OLLAMA_KEEP_ALIVE: "60s"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install Ollama prerequisites
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Setup Ollama
        uses: ai-action/setup-ollama@v2
      # Model-file actions/cache deliberately disabled: it persists large model blobs
      # between runs but does not reduce model RAM usage and can consume cache quota.
      - name: Start Ollama and pull model
        env:
          OLLAMA_KEEP_ALIVE: "60s"
          OLLAMA_NUM_PARALLEL: "1"
          OLLAMA_MAX_LOADED_MODELS: "1"
          OLLAMA_FLASH_ATTENTION: "1"
          OLLAMA_CONTEXT_LENGTH: "2048"
        run: |
          mkdir -p artifacts/diagnostics
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          ollama pull "$QWEN_MODEL"
          ollama list
          ollama show "$QWEN_MODEL" > artifacts/diagnostics/model-info.txt
          python - <<'PYMODEL'
          import json
          import os
          from urllib.request import Request, urlopen

          payload = json.dumps({"model": os.environ["QWEN_MODEL"]}).encode("utf-8")
          request = Request(
              "http://127.0.0.1:11434/api/show",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              details = json.load(response)
          with open("artifacts/diagnostics/model-details.json", "w", encoding="utf-8") as f:
              json.dump(details.get("details", {}), f, indent=2)
          PYMODEL
      - name: Smoke-test local model endpoint
        shell: bash
        run: |
          # Qwen3 may spend a tiny token budget in its separate "thinking" field,
          # leaving message.content empty and falsely failing a health check.
          # Disable thinking for this deterministic connectivity smoke test.
          python - <<'PYSMOKE'
          import json
          from urllib.request import Request, urlopen
          import os

          payload = {
              "model": os.environ["QWEN_MODEL"],
              "stream": False,
              "think": False,
              "messages": [{"role": "user", "content": "Reply with exactly OK"}],
              "options": {"num_ctx": 2048, "num_predict": 32, "temperature": 0},
          }
          request = Request(
              "http://127.0.0.1:11434/api/chat",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=90) as response:
              data = json.load(response)
          message = data.get("message") or {}
          content = (message.get("content") or "").strip()
          if not content:
              raise SystemExit(
                  "Ollama smoke test returned no message.content. "
                  f"done_reason={data.get('done_reason')!r}; "
                  f"thinking_chars={len(message.get('thinking') or '')}. "
                  "Check that this Ollama version supports think=false."
              )
          print(f"Ollama smoke test passed for {payload['model']}: {content[:80]!r}")
          PYSMOKE
      - name: Unit-test benchmark harness
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run self-repair benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_GITHUB_ISSUES: "1"
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/diagnostics
          (while true; do
            date -Is
            free -h
            ps -eo pid,rss,comm,args --sort=-rss | head -n 12
            echo "---"
            sleep 15
          done) > "$RUNNER_TEMP/resource-samples.log" 2>&1 &
          sampler_pid=$!
          python agent/self_repair_agent.py
          status=$?
          kill "$sampler_pid" >/dev/null 2>&1 || true
          wait "$sampler_pid" 2>/dev/null || true
          cp "$RUNNER_TEMP/resource-samples.log" artifacts/diagnostics/resource-samples.log 2>/dev/null || true
          exit "$status"
      - name: Capture diagnostics and remove bytecode caches
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/diagnostics
          if [ -f "$RUNNER_TEMP/ollama.log" ]; then
            tail -n 400 "$RUNNER_TEMP/ollama.log" > artifacts/diagnostics/ollama.log
          fi
          {
            echo "### Runner memory"; free -h || true
            echo "### Filesystem"; df -h "$HOME" || true
            echo "### Ollama models"; ollama list || true
          } > artifacts/diagnostics/runner-resources.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true
      - name: Upload model-specific results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfrepair-${{ strategy.job-index }}-${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Unload model and remove local Ollama cache
        if: always()
        shell: bash
        run: |
          ollama stop "$QWEN_MODEL" >/dev/null 2>&1 || true
          rm -rf "$HOME/.ollama/models" "$HOME/.ollama/tmp" "$HOME/.cache/pip" || true
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true

  aggregate:
    name: Aggregate model results
    if: always()
    needs: [select-models, benchmark]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all model artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: selfrepair-*
          path: downloaded-results
          merge-multiple: false
      - name: Inspect downloaded artifacts
        if: always()
        run: |
          echo "Downloaded artifact tree:"
          find downloaded-results -maxdepth 5 -type f -print 2>/dev/null || true
      - name: Aggregate JSON and Markdown report
        run: python scripts/aggregate_results.py downloaded-results
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfrepair-aggregate-report
          path: aggregate-report/
          if-no-files-found: warn
          retention-days: 90

  report-benchmark-failure:
    name: Report benchmark workflow failure as a GitHub Issue
    needs: [benchmark, aggregate]
    if: always() && (needs.benchmark.result == 'failure' || needs.aggregate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: Create or update a deduplicated benchmark failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Automated benchmark workflow failure: Open-Source SLM Self-Repair Benchmark"
          FAILED_STEPS=$(gh run view "$RUN_ID" --repo "$GH_REPO" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | {job: .name, steps: [.steps[] | select(.conclusion == "failure") | .name]}]' 2>/dev/null || echo "Unable to query failed step names; open the run URL.")
          BODY=$(cat <<EOF
          ## Automated benchmark workflow failure

          One or more model jobs or aggregation failed. This issue records an incomplete/failed CI run; it does not by itself mean a model failed a coding test.

          - **Run:** ${RUN_URL}
          - **Run ID / attempt:** ${RUN_ID} / ${RUN_ATTEMPT}
          - **Branch:** ${BRANCH_NAME}
          - **Benchmark matrix result:** ${BENCHMARK_RESULT}
          - **Aggregation result:** ${AGGREGATE_RESULT}

          ### Failed jobs and steps
          ${FAILED_STEPS}

          ### Diagnostics to inspect
          - Open each model artifact and inspect diagnostics/ollama.log, diagnostics/model-info.txt, diagnostics/model-details.json, and diagnostics/runner-resources.txt.
          - A model artifact without selfrepair_log.json means evaluation did not complete; check setup and smoke-test steps first.
          - If selfrepair_log.json exists, distinguish model invocation errors from incorrect test outputs.
          - Aggregation must include every enabled model, or explicitly report missing model reports.

          This issue is generated automatically. Do not include secrets, tokens, or credentials in issue comments.
          EOF
          )
          gh label create automation --repo "$GH_REPO" --color 5319e7 --description "Created or updated by workflow automation" 2>/dev/null || true
          gh label create bug --repo "$GH_REPO" --color d73a4a --description "Bug or workflow failure" 2>/dev/null || true
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open --search '"Automated benchmark workflow failure" in:title' --json number,title --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n1 || true)
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body "$BODY"
            echo "Updated existing benchmark issue #$EXISTING"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY" --label "automation,bug"
          fi
