name: Open-Source SLM Self-Repair Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "problems/**"
      - "tests/**"
      - ".github/workflows/qwen-selfrepair.yml"
      - "requirements.txt"
      - "scripts/**"

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    name: Benchmark ${{ matrix.model }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: "qwen3:0.6b"
            artifact: "qwen3-0.6b"
          - model: "qwen3:1.7b"
            artifact: "qwen3-1.7b"
          - model: "qwen3:4b"
            artifact: "qwen3-4b"
    timeout-minutes: 90
    env:
      QWEN_MODEL: ${{ matrix.model }}
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
      MAX_REPAIR_ROUNDS: "3"
      EXEC_TIMEOUT_SECONDS: "5"
      LLM_TIMEOUT_SECONDS: "240"
      LLM_MAX_TOKENS: "2048"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install Ollama prerequisites
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Setup Ollama
        uses: ai-action/setup-ollama@v2
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ runner.os }}-${{ matrix.model }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ollama-${{ runner.os }}-${{ matrix.model }}-
      - name: Start Ollama and pull model
        run: |
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          ollama pull "$QWEN_MODEL"
          ollama list
      - name: Smoke-test local model endpoint
        run: |
          curl --silent --show-error --fail http://127.0.0.1:11434/api/chat \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$QWEN_MODEL\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly OK\"}]}" \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("message",{}).get("content"), d; print("Ollama model response received")'
      - name: Unit-test benchmark harness
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run self-repair benchmark
        run: python agent/self_repair_agent.py
      - name: Upload model-specific results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfrepair-${{ strategy.job-index }}-${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate model results
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all model artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: selfrepair-*
          path: downloaded-results
          merge-multiple: false
      - name: Inspect downloaded artifacts
        if: always()
        run: |
          echo "Downloaded artifact tree:"
          find downloaded-results -maxdepth 4 -type f -print 2>/dev/null || true
      - name: Aggregate JSON and Markdown report
        run: python scripts/aggregate_results.py downloaded-results
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfrepair-aggregate-report
          path: aggregate-report/
          if-no-files-found: warn
          retention-days: 90


  report-benchmark-failure:
    name: Report benchmark workflow failure as a GitHub Issue
    needs: [benchmark, aggregate]
    if: always() && (needs.benchmark.result == 'failure' || needs.aggregate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: Create or update a deduplicated benchmark failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Automated benchmark workflow failure: Open-Source SLM Self-Repair Benchmark"
          BODY=$(cat <<EOF
          ## Automated benchmark workflow failure

          One or more benchmark/aggregation jobs failed.

          - **Run:** ${RUN_URL}
          - **Run ID / attempt:** ${RUN_ID} / ${RUN_ATTEMPT}
          - **Branch:** ${BRANCH_NAME}
          - **Benchmark matrix result:** ${BENCHMARK_RESULT}
          - **Aggregation result:** ${AGGREGATE_RESULT}

          ### Investigation checklist
          1. Inspect each model job for Ollama setup, model pull, inference timeout, and test failures.
          2. Confirm each expected model artifact was uploaded.
          3. Confirm aggregation found and validated model reports.
          4. Re-run after fixing the root cause.

          This issue is generated automatically. Do not include secrets, tokens, or credentials in issue comments.
          EOF
          )
          gh label create automation --repo "$GH_REPO" --color 5319e7 --description "Created or updated by coding-agent automation" 2>/dev/null || true
          gh label create bug --repo "$GH_REPO" --color d73a4a --description "Bug or workflow failure" 2>/dev/null || true
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open --search '"Automated benchmark workflow failure" in:title' --json number,title --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n1 || true)
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body "$BODY"
            echo "Updated existing benchmark issue #$EXISTING"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY" --label "automation,bug"
          fi
