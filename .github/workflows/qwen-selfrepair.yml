# .github/workflows/qwen-selfrepair.yml
name: Qwen Self-Repair Agent (Local Ollama)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  self-repair:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "langchain>=1.0" langchain-openai langchain-community

      - name: Start Ollama and pull Qwen3 model
        uses: pydantic/ollama-action@v3
        with:
          model: qwen3:4b          # change to qwen3:8b if you want a larger model

      - name: Run Qwen self-repair agent (local)
        env:
          OLLAMA_BASE_URL: "http://localhost:11434/v1"
          OLLAMA_API_KEY: "ollama"   # placeholder; Ollama does not validate it
          QWEN_MODEL: "qwen3:4b"
          PYTHONUNBUFFERED: "1"
        run: |
          python agent/self_repair_agent.py

      - name: Upload self-repair log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfrepair-log
          path: selfrepair_log.json
          retention-days: 14

      - name: Upload final solutions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-solutions
          path: solution.py
          retention-days: 14